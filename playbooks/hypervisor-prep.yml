---
# One-time (re-runnable) preparation of a libvirt hypervisor for VM builds.
#   ansible-playbook playbooks/hypervisor-prep.yml
# Installs Terraform, sets up /opt/vm-builder, downloads + verifies the Ubuntu base
# images and loads them into the libvirt pool (terraform/images), and backs up state.
- name: Prepare hypervisor for Terraform VM builds
  hosts: hypervisors
  become: true

  vars:
    tf_images_dir: "{{ vm_builder_dir }}/images"
    tf_cache_dir: "{{ vm_builder_dir }}/cache"
    tf_plugin_cache: "{{ vm_builder_dir }}/.plugin-cache"
    repo_root: "{{ inventory_dir }}/.."

  tasks:
    # ---------- Terraform ----------
    # A hand-made HashiCorp repo entry (2025) pins a keyring without HashiCorp's current
    # signing key, which breaks `apt update`; two entries for one repo with different
    # Signed-By values is also an apt error. Replace it with the managed deb822 source.
    - name: Remove legacy HashiCorp apt entry and its outdated keyring
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/hashicorp.list
        - /usr/share/keyrings/hashicorp-archive-keyring.gpg

    - name: Install prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, gpg]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Add HashiCorp apt repository
      ansible.builtin.deb822_repository:
        name: hashicorp
        types: deb
        uris: https://apt.releases.hashicorp.com
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: main
        signed_by: https://apt.releases.hashicorp.com/gpg
        state: present

    - name: Install Terraform {{ terraform_version }}
      ansible.builtin.apt:
        name: "terraform={{ terraform_version }}-*"
        state: present
        update_cache: true
        allow_change_held_packages: true

    - name: Hold Terraform at {{ terraform_version }}
      ansible.builtin.dpkg_selections:
        name: terraform
        selection: hold

    # ---------- Shared group and directories ----------
    - name: Create group {{ vm_builder_group }}
      ansible.builtin.group:
        name: "{{ vm_builder_group }}"
        system: true

    - name: Add VM builders to {{ vm_builder_group }} and libvirt
      ansible.builtin.user:
        name: "{{ item }}"
        groups: ["{{ vm_builder_group }}", libvirt]
        append: true
      loop: "{{ vm_builder_users }}"
      register: builder_groups

    - name: Reconnect so new group membership applies to this session
      ansible.builtin.meta: reset_connection
      when: builder_groups is changed

    - name: Create {{ vm_builder_dir }} tree (setgid, group-writable)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: "{{ vm_builder_group }}"
        mode: "2775"
      loop:
        - "{{ vm_builder_dir }}"
        - "{{ tf_images_dir }}"
        - "{{ tf_cache_dir }}"
        - "{{ tf_plugin_cache }}"

    # ---------- Base images: download + verify ----------
    - name: Download Ubuntu cloud images (SHA-256 verified)
      ansible.builtin.get_url:
        url: "{{ item.value.url }}"
        dest: "{{ tf_cache_dir }}/ubuntu-{{ item.key }}-{{ item.value.build }}.img"
        checksum: "sha256:{{ item.value.sha256 }}"
        owner: root
        group: "{{ vm_builder_group }}"
        mode: "0644"
        timeout: 600
      loop: "{{ ubuntu_images | dict2items }}"
      loop_control: { label: "{{ item.key }} ({{ item.value.build }})" }

    # ---------- terraform/images ----------
    - name: Copy terraform/images code
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ tf_images_dir }}/"
        owner: root
        group: "{{ vm_builder_group }}"
        mode: "0664"
      with_fileglob:
        - "{{ repo_root }}/terraform/images/*.tf"
        - "{{ repo_root }}/terraform/images/.terraform.lock.hcl"

    - name: Write image variables file
      ansible.builtin.template:
        src: "{{ repo_root }}/templates/vm-builder/images.auto.tfvars.json.j2"
        dest: "{{ tf_images_dir }}/images.auto.tfvars.json"
        owner: root
        group: "{{ vm_builder_group }}"
        mode: "0664"

    - name: Terraform init (as {{ ansible_user | default('kwood') }}, group-writable files)
      ansible.builtin.shell: |
        set -euo pipefail
        umask 0002
        terraform init -input=false -no-color
      args:
        chdir: "{{ tf_images_dir }}"
        executable: /bin/bash
      environment:
        TF_PLUGIN_CACHE_DIR: "{{ tf_plugin_cache }}"
        TF_IN_AUTOMATION: "1"
      become: false
      register: tf_init
      changed_when: "'Installing dmacvicar/libvirt' in tf_init.stdout"

    # terraform init creates .terraform/ and the lock file without group write, whatever
    # the umask, which would stop other vm-builder members (gha-runner) re-initialising.
    - name: Make Terraform's working files group-writable
      ansible.builtin.file:
        path: "{{ item }}"
        mode: g+rwX
        group: "{{ vm_builder_group }}"
        recurse: "{{ item is not search('lock.hcl$') }}"
      loop:
        - "{{ tf_images_dir }}/.terraform"
        - "{{ tf_images_dir }}/.terraform.lock.hcl"
        - "{{ tf_plugin_cache }}"

    - name: Terraform plan
      ansible.builtin.shell: |
        set -uo pipefail
        umask 0002
        terraform plan -input=false -no-color -detailed-exitcode -out=tfplan
      args:
        chdir: "{{ tf_images_dir }}"
        executable: /bin/bash
      environment:
        TF_PLUGIN_CACHE_DIR: "{{ tf_plugin_cache }}"
        TF_IN_AUTOMATION: "1"
      become: false
      register: tf_plan
      changed_when: false
      failed_when: tf_plan.rc not in [0, 2]   # 0 = no changes, 2 = changes pending

    - name: Show planned changes
      ansible.builtin.debug:
        msg: "{{ tf_plan.stdout_lines | select('search', '^(  [#~+-]|Plan:)') | list }}"
      when: tf_plan.rc == 2

    - name: Terraform apply (loads base images into pool {{ libvirt_pool }})
      ansible.builtin.shell: |
        set -euo pipefail
        umask 0002
        terraform apply -input=false -no-color tfplan
      args:
        chdir: "{{ tf_images_dir }}"
        executable: /bin/bash
      environment:
        TF_PLUGIN_CACHE_DIR: "{{ tf_plugin_cache }}"
        TF_IN_AUTOMATION: "1"
      become: false
      when: tf_plan.rc == 2
      changed_when: true

    - name: Keep the provider lock file in the repo
      ansible.builtin.fetch:
        src: "{{ tf_images_dir }}/.terraform.lock.hcl"
        dest: "{{ repo_root }}/terraform/images/.terraform.lock.hcl"
        flat: true

    # ---------- State backups ----------
    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ vm_builder_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install state backup script
      ansible.builtin.template:
        src: "{{ repo_root }}/templates/vm-builder/state-backup.sh.j2"
        dest: /usr/local/sbin/vm-builder-state-backup
        owner: root
        group: root
        mode: "0750"

    - name: Install backup service and timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - name: vm-builder-state-backup.service
          content: |
            [Unit]
            Description=Back up VM builder Terraform state

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/vm-builder-state-backup
        - name: vm-builder-state-backup.timer
          content: |
            [Unit]
            Description=Nightly VM builder Terraform state backup

            [Timer]
            OnCalendar=*-*-* 03:15:00
            RandomizedDelaySec=10m
            Persistent=true

            [Install]
            WantedBy=timers.target
      loop_control: { label: "{{ item.name }}" }

    - name: Enable backup timer
      ansible.builtin.systemd_service:
        name: vm-builder-state-backup.timer
        state: started
        enabled: true
        daemon_reload: true

    # ---------- Checks ----------
    - name: Check virtualisation support
      ansible.builtin.command: virt-host-validate qemu
      register: vhv
      changed_when: false
      failed_when: vhv.stdout is search(':\s*FAIL')

    - name: Check Terraform version
      ansible.builtin.command: terraform version -json
      register: tf_version
      changed_when: false
      failed_when: (tf_version.stdout | from_json).terraform_version != terraform_version

    - name: List base volumes in pool {{ libvirt_pool }}
      ansible.builtin.command: virsh -c {{ libvirt_uri }} vol-list {{ libvirt_pool }}
      register: vols
      changed_when: false
      become: false
      failed_when: >-
        ubuntu_images | dict2items
        | rejectattr('key', 'in', vols.stdout | regex_findall('ubuntu-([0-9.]+)-[0-9]{8}-base\.qcow2'))
        | list | length > 0

    - name: Report
      ansible.builtin.debug:
        msg:
          - "Terraform {{ (tf_version.stdout | from_json).terraform_version }}"
          - "{{ vols.stdout_lines | select('search', '-base\\.qcow2') | map('trim') | list }}"
          - "virt-host-validate warnings: {{ vhv.stdout_lines | select('search', 'WARN') | map('regex_replace', '\\s+', ' ') | list }}"

# ---------------------------------------------------------------------------
# GitHub Actions self-hosted runner for vm-gitops.yml (build-vm.md §6a).
#   install (default):  ansible-playbook playbooks/hypervisor-prep.yml
#   remove:             ansible-playbook playbooks/hypervisor-prep.yml -e gha_runner_remove=yes
- name: GitHub Actions runner on the hypervisor
  hosts: hypervisors
  become: true

  vars:
    runner_tarball: "actions-runner-linux-x64-{{ gha_runner_version }}.tar.gz"
    runner_url: "https://github.com/{{ gha_runner_repo }}"
    remove: "{{ gha_runner_remove | default(false) | bool }}"

  tasks:
    - name: Skip when the runner isn't wanted
      ansible.builtin.meta: end_play
      when: not (gha_runner_install | bool) and not remove

    # ---------- Remove ----------
    - name: Remove the runner
      when: remove
      block:
        - name: Get a removal token
          ansible.builtin.command: gh api -X POST repos/{{ gha_runner_repo }}/actions/runners/remove-token --jq .token
          register: rm_token
          changed_when: false
          no_log: true
          delegate_to: localhost
          become: false
          vars: { ansible_python_interpreter: "{{ ansible_playbook_python }}" }

        - name: Stop and uninstall the service, then unregister
          ansible.builtin.shell: |
            set -u
            cd {{ gha_runner_dir }} || exit 0
            ./svc.sh stop || true
            ./svc.sh uninstall || true
            sudo -u {{ gha_runner_user }} ./config.sh remove --token "$TOKEN" || true
          environment:
            TOKEN: "{{ rm_token.stdout }}"
          changed_when: true
          no_log: true

        - name: Delete the runner directory
          ansible.builtin.file:
            path: "{{ gha_runner_dir }}"
            state: absent

        - name: Done
          ansible.builtin.meta: end_play

    # ---------- User ----------
    - name: Install runner prerequisites
      ansible.builtin.apt:
        name: [acl, git, python3-venv, jq]
        state: present

    - name: Create the {{ gha_runner_user }} user
      ansible.builtin.user:
        name: "{{ gha_runner_user }}"
        system: true
        shell: /bin/bash
        create_home: true
        groups: [libvirt, kvm, "{{ vm_builder_group }}"]
        append: true
        generate_ssh_key: true          # used to reach VMs it builds
        ssh_key_type: ed25519
        ssh_key_comment: "{{ gha_runner_user }}@{{ inventory_hostname }}"

    # You chose passwordless sudo for the runner (build-vm.md §9 explains the risk).
    - name: Give {{ gha_runner_user }} passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/{{ gha_runner_user }}
        content: "{{ gha_runner_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    # ---------- Ansible for CI jobs ----------
    - name: Create the CI Ansible venv
      ansible.builtin.pip:
        name: "ansible-core=={{ gha_runner_ansible_core }}"
        virtualenv: "{{ gha_runner_venv }}"
        virtualenv_command: python3 -m venv

    - name: Install collections the playbooks use
      ansible.builtin.command: >-
        {{ gha_runner_venv }}/bin/ansible-galaxy collection install
        'community.general:>=13.0.0,<14.0.0' -p {{ vm_builder_dir }}/collections
      args:
        creates: "{{ vm_builder_dir }}/collections/ansible_collections/community/general"

    - name: Make the venv and collections readable by {{ vm_builder_group }}
      ansible.builtin.file:
        path: "{{ item }}"
        group: "{{ vm_builder_group }}"
        mode: g+rX
        recurse: true
      loop:
        - "{{ gha_runner_venv }}"
        - "{{ vm_builder_dir }}/collections"

    # ---------- Runner ----------
    - name: Create {{ gha_runner_dir }}
      ansible.builtin.file:
        path: "{{ gha_runner_dir }}"
        state: directory
        owner: "{{ gha_runner_user }}"
        group: "{{ gha_runner_user }}"
        mode: "0750"

    - name: Download runner {{ gha_runner_version }} (SHA-256 verified)
      ansible.builtin.get_url:
        url: "https://github.com/actions/runner/releases/download/v{{ gha_runner_version }}/{{ runner_tarball }}"
        dest: "{{ gha_runner_dir }}/{{ runner_tarball }}"
        checksum: "sha256:{{ gha_runner_sha256 }}"
        owner: "{{ gha_runner_user }}"
        mode: "0640"

    - name: Unpack runner
      ansible.builtin.unarchive:
        src: "{{ gha_runner_dir }}/{{ runner_tarball }}"
        dest: "{{ gha_runner_dir }}"
        remote_src: true
        owner: "{{ gha_runner_user }}"
        group: "{{ gha_runner_user }}"
        creates: "{{ gha_runner_dir }}/config.sh"

    - name: Install the runner's OS dependencies
      ansible.builtin.command: ./bin/installdependencies.sh
      args:
        chdir: "{{ gha_runner_dir }}"
        creates: "{{ gha_runner_dir }}/.deps-installed"
      register: deps

    - name: Record that dependencies are installed
      ansible.builtin.file:
        path: "{{ gha_runner_dir }}/.deps-installed"
        state: touch
        mode: "0644"
      when: deps is changed

    - name: Check whether the runner is registered
      ansible.builtin.stat:
        path: "{{ gha_runner_dir }}/.runner"
      register: runner_cfg

    - name: Register the runner
      when: not runner_cfg.stat.exists
      block:
        - name: Get a short-lived registration token (your gh login)
          ansible.builtin.command: gh api -X POST repos/{{ gha_runner_repo }}/actions/runners/registration-token --jq .token
          register: reg_token
          changed_when: false
          no_log: true
          delegate_to: localhost
          become: false
          vars: { ansible_python_interpreter: "{{ ansible_playbook_python }}" }

        - name: Configure the runner (repo-level)
          ansible.builtin.command: >-
            ./config.sh --unattended --replace
            --url {{ runner_url }} --token {{ reg_token.stdout }}
            --name {{ gha_runner_name }} --labels {{ gha_runner_labels | join(',') }}
            --work _work
          args:
            chdir: "{{ gha_runner_dir }}"
          become_user: "{{ gha_runner_user }}"
          no_log: true

    - name: Install the runner as a systemd service
      ansible.builtin.command: ./svc.sh install {{ gha_runner_user }}
      args:
        chdir: "{{ gha_runner_dir }}"
        creates: "{{ gha_runner_dir }}/.service"

    - name: Find the service name
      ansible.builtin.slurp:
        src: "{{ gha_runner_dir }}/.service"
      register: svc_file

    - name: Start and enable the runner service
      ansible.builtin.systemd_service:
        name: "{{ svc_file.content | b64decode | trim }}"
        state: started
        enabled: true

    # ---------- Check ----------
    - name: Wait for GitHub to show the runner online
      ansible.builtin.command: >-
        gh api repos/{{ gha_runner_repo }}/actions/runners
        --jq '.runners[] | select(.name=="{{ gha_runner_name }}") | "\(.status) \([.labels[].name] | join(","))"'
      register: runner_status
      until: runner_status.stdout is search('^online')
      retries: 12
      delay: 5
      changed_when: false
      delegate_to: localhost
      become: false
      vars: { ansible_python_interpreter: "{{ ansible_playbook_python }}" }

    - name: Report
      ansible.builtin.debug:
        msg: "Runner {{ gha_runner_name }}: {{ runner_status.stdout }} (service {{ svc_file.content | b64decode | trim }})"
