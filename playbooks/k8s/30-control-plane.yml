---
- name: "Phase 3: control plane (kubeadm init)"
  hosts: k8s_control_plane
  become: true

  tasks:
    - name: Ensure /etc/kubernetes exists
      ansible.builtin.file:
        path: /etc/kubernetes
        state: directory
        mode: "0755"

    - name: Ensure local ~/.kube exists on the control machine
      ansible.builtin.file:
        path: "{{ k8s_local_kubeconfig | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Render kubeadm config
      ansible.builtin.template:
        src: "{{ repo_templates }}/k8s/kubeadm-config.yaml.j2"
        dest: /etc/kubernetes/kubeadm-config.yaml
        owner: root
        group: root
        mode: "0600"

    - name: Check whether the cluster is already initialised
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Initialise control plane
      when: not admin_conf.stat.exists
      block:
        - name: Pre-pull control plane images
          ansible.builtin.command: kubeadm config images pull --config /etc/kubernetes/kubeadm-config.yaml
          changed_when: true

        - name: kubeadm init
          ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --upload-certs
          register: kubeadm_init
          changed_when: true

    # ---------- kubeconfig ----------
    - name: Create ~/.kube for {{ k8s_admin_user }}
      ansible.builtin.file:
        path: "/home/{{ k8s_admin_user }}/.kube"
        state: directory
        owner: "{{ k8s_admin_user }}"
        group: "{{ k8s_admin_user }}"
        mode: "0700"

    - name: Install admin kubeconfig for {{ k8s_admin_user }}
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ k8s_admin_user }}/.kube/config"
        remote_src: true
        owner: "{{ k8s_admin_user }}"
        group: "{{ k8s_admin_user }}"
        mode: "0600"

    - name: Read admin kubeconfig
      ansible.builtin.slurp:
        src: /etc/kubernetes/admin.conf
      register: admin_kubeconfig
      no_log: true

    - name: Write local kubeconfig, pointed at the API IP (k8s-api doesn't resolve off-cluster)
      ansible.builtin.copy:
        dest: "{{ k8s_local_kubeconfig }}"
        content: >-
          {{ admin_kubeconfig.content | b64decode
             | regex_replace('server: https://' ~ k8s_api_name ~ ':', 'server: https://' ~ k8s_api_ip ~ ':') }}
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    # ---------- Checks ----------
    - name: Wait for the API server
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw /readyz
      register: api_ready
      until: api_ready.rc == 0 and api_ready.stdout == 'ok'
      retries: 30
      delay: 5
      changed_when: false

    - name: Check control plane pods
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system get pods
        -l tier=control-plane -o jsonpath='{range .items[*]}{.metadata.name}={.status.phase}{"\n"}{end}'
      register: cp_pods
      until: >-
        cp_pods.stdout_lines | length >= 4 and
        cp_pods.stdout_lines | reject('search', '=Running$') | list | length == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Report control plane
      ansible.builtin.debug:
        msg:
          - "{{ cp_pods.stdout_lines }}"
          - "Local kubeconfig: {{ k8s_local_kubeconfig }} (node is NotReady until Phase 4 installs Calico)"
