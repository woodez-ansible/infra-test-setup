---
# DESTRUCTIVE: tears the cluster down on every node. Phase 0-2 OS setup is kept.
#   ansible-playbook playbooks/k8s/99-reset.yml -e confirm_reset=yes
- name: Reset Kubernetes cluster
  hosts: k8s_cluster
  become: true

  pre_tasks:
    - name: Require explicit confirmation
      ansible.builtin.assert:
        that: confirm_reset | default('') == 'yes'
        fail_msg: "This deletes the cluster. Re-run with -e confirm_reset=yes"
      run_once: true

  tasks:
    - name: Disable etcd backup timer (control plane)
      ansible.builtin.systemd_service:
        name: etcd-backup.timer
        state: stopped
        enabled: false
      failed_when: false
      when: inventory_hostname in groups['k8s_control_plane']

    - name: kubeadm reset
      ansible.builtin.command: kubeadm reset -f
      changed_when: true
      failed_when: false

    - name: Remove CNI config, Calico state and kubeconfigs
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cni/net.d
        - /var/lib/calico
        - /var/run/calico
        - /etc/kubernetes/kubeadm-config.yaml
        - "/home/{{ k8s_admin_user }}/.kube"

    - name: Delete Calico VXLAN interface
      ansible.builtin.command: ip link delete vxlan.calico
      register: vxlan_del
      changed_when: vxlan_del.rc == 0
      failed_when: false

    - name: Flush iptables rules left by kube-proxy and Calico
      ansible.builtin.shell: |
        iptables -F && iptables -t nat -F && iptables -t mangle -F && iptables -X
        ip6tables -F && ip6tables -t nat -F && ip6tables -t mangle -F && ip6tables -X
      changed_when: true

    - name: Restart containerd and kubelet
      ansible.builtin.service:
        name: "{{ item }}"
        state: restarted
      loop: [containerd, kubelet]
      failed_when: false
