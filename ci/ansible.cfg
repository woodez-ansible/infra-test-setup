# Ansible config for GitHub Actions jobs on the compute02 runner (ANSIBLE_CONFIG=ci/ansible.cfg).
# Differences from the repo's ansible.cfg: compute02 is the local machine, collections come
# from the runner's install, and there is NO vault (no vault password exists on the runner).
[defaults]
inventory = ../inventory/ci.yml
collections_path = /opt/vm-builder/collections
interpreter_python = auto_silent
host_key_checking = True
stdout_callback = default
retry_files_enabled = False

[privilege_escalation]
become_method = sudo
