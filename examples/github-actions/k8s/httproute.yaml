# Publishes the app at http://__HOST__/ on the shared Gateway (192.168.2.240).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: __APP__
spec:
  parentRefs:
    - name: public
      namespace: gateway
  hostnames:
    - __HOST__
  rules:
    - backendRefs:
        - name: __APP__
          port: 80
