# cloudbase-init service config (runs at each boot after sysprep). Reads the NoCloud
# "cidata" ISO that terraform/vm attaches, like cloud-init on the Linux VMs.
# No user/password plugins: the 'ansible' admin is baked into the image.
[DEFAULT]
username=ansible
groups=Administrators
inject_user_password=false
first_logon_behaviour=no
config_drive_raw_hhd=false
config_drive_cdrom=true
config_drive_vfat=false
bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
verbose=true
debug=true
log_dir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
log_file=cloudbase-init.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN
mtu_use_dhcp_config=true
ntp_use_dhcp_config=false
local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\
check_latest_version=false
metadata_services=cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService
plugins=cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,cloudbaseinit.plugins.windows.winrmlistener.ConfigWinRMListenerPlugin,cloudbaseinit.plugins.common.userdata.UserDataPlugin
netbios_host_name_compatibility=true
allow_reboot=true
stop_service_on_exit=false
# WinRM: HTTPS only (self-signed certificate per VM), NTLM; no Basic, no HTTP
winrm_configure_https_listener=true
winrm_configure_http_listener=false
winrm_enable_basic_auth=false
